<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>墨匣</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#5c7a4e">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="墨匣">
<meta name="format-detection" content="telephone=no,email=no,address=no">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png">
<style>
/* ============================================================
   墨匣 · iPad 版
   设计原则：一屏只做一件事 / 层级用「进·退」不用左右分栏
            按手指尺寸做热区 / 字号与留白随宽度流体变化
   ============================================================ */
:root{
  --bg:#f6f5f2;
  --surface:#ffffff;
  --surface-2:#faf9f7;
  --surface-3:#f1efeb;
  --text:#1f1d1a;
  --text-2:#57534c;
  --muted:#928d84;
  --faint:#bdb8ae;
  --line:#eae7e1;
  --line-2:#dcd8d0;

  --green:#5c7a4e;
  --green-deep:#415a37;
  --green-soft:#e9f0e4;
  --green-ink:#2e4227;

  --accent:#ff6a2b;
  --accent-deep:#ef5a17;
  --accent-soft:#fff1e9;

  --danger:#c0392b;
  --danger-soft:#fdf0ed;

  --shadow-1:0 1px 2px rgba(35,30,22,.05), 0 2px 10px -6px rgba(35,30,22,.14);
  --shadow-2:0 10px 30px -14px rgba(35,30,22,.28);
  --shadow-3:0 20px 50px -18px rgba(35,30,22,.42);

  --r-sm:9px; --r-md:14px; --r-lg:20px; --r-xl:26px;

  /* 流体尺度：按 iPad 可用宽度（约 526~1024px）标定 */
  --pad:clamp(14px, 4vw, 26px);
  --fs-hero:clamp(24px, 5.2vw, 34px);
  --fs-title:clamp(17px, 3.4vw, 22px);
  --fs-body:clamp(13.5px, 2.6vw, 15.5px);
  --fs-sub:clamp(12px, 2.2vw, 13.5px);
  --tap:clamp(42px, 9vw, 48px);      /* 最小可点高度 */
  --nav-h:clamp(56px, 11vw, 66px);   /* 底部导航高 */

  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);
  --safe-r:env(safe-area-inset-right,0px);

  /* 阅读区（可在设置里改） */
  --read-bg:#fbf8f1;
  --read-fg:#2c2721;
  --read-font:"Songti SC","STSong",SimSun,serif;
  --read-fs:clamp(17px, 3.4vw, 21px);
  --read-lh:1.9;
}
:root[data-theme="dark"]{
  --bg:#171615;
  --surface:#21201e;
  --surface-2:#262523;
  --surface-3:#2d2c29;
  --text:#ece8e1;
  --text-2:#b3ada3;
  --muted:#8a8479;
  --faint:#5c574f;
  --line:#302f2c;
  --line-2:#3b3936;
  --green:#7a9c66; --green-deep:#5b7a4a; --green-soft:#232c1f; --green-ink:#d8e8cf;
  --accent:#ff7a41; --accent-deep:#ff8b57; --accent-soft:#3a2419;
  --danger:#e78b74; --danger-soft:#33231f;
  --shadow-1:0 1px 2px rgba(0,0,0,.4);
  --shadow-2:0 12px 30px -16px rgba(0,0,0,.8);
  --shadow-3:0 22px 50px -20px rgba(0,0,0,.9);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{height:100%; margin:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--text); overflow:hidden;
  font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,-apple-system,sans-serif;
  font-size:var(--fs-body); line-height:1.6;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
}
button,input,select,textarea{font:inherit; color:inherit}
button{background:none; border:none; padding:0; cursor:pointer; touch-action:manipulation}
input,textarea,select{touch-action:manipulation}
[hidden]{display:none !important}
svg{display:block}
.ic{fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.if{fill:currentColor}

/* ================= 应用骨架 ================= */
.app{height:100dvh; display:flex; flex-direction:column; padding-left:var(--safe-l); padding-right:var(--safe-r)}
.screen{display:none; flex:1; min-height:0; flex-direction:column}
.screen.on{display:flex}

/* 顶部栏：一屏一个任务，左边返回/菜单，中间标题，右边操作 */
.bar{
  flex:0 0 auto; display:flex; align-items:center; gap:6px;
  min-height:var(--tap); padding:calc(6px + var(--safe-t)) var(--pad) 6px;
  background:var(--surface); border-bottom:1px solid var(--line); position:relative; z-index:5;
}
.bar.plain{background:transparent; border-bottom:none}
.bar .t{
  flex:1; min-width:0; font-size:var(--fs-title); font-weight:700; letter-spacing:.02em;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.bar .t small{font-size:var(--fs-sub); color:var(--muted); font-weight:400; margin-left:8px}
.tbtn{
  width:var(--tap); height:var(--tap); border-radius:14px; display:flex; align-items:center; justify-content:center;
  color:var(--text-2); flex:0 0 auto; transition:background .16s, color .16s, transform .12s;
}
.tbtn:active{background:var(--surface-3); transform:scale(.92)}
.tbtn svg{width:22px; height:22px}
.tbtn.accent{color:var(--accent)}

/* 正文滚动区 */
.scroll{flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; touch-action:pan-y}
.pad{padding:var(--pad)}

/* ================= 底部导航 ================= */
.nav{
  flex:0 0 auto; display:flex; align-items:stretch; background:var(--surface);
  border-top:1px solid var(--line); padding-bottom:var(--safe-b); z-index:6;
}
.nav button{
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  height:var(--nav-h); color:var(--muted); font-size:clamp(11px, 2.2vw, 12.5px);
  transition:color .16s;
}
.nav button svg{width:23px; height:23px}
.nav button.on{color:var(--green); font-weight:600}
.nav button.on svg{stroke-width:2.1}
.nav button:active{background:var(--surface-2)}

/* ================= 通用元素 ================= */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  height:var(--tap); padding:0 clamp(14px, 3.4vw, 20px); border-radius:14px;
  background:var(--surface-2); border:1px solid var(--line-2); color:var(--text);
  font-size:var(--fs-body); font-weight:500; white-space:nowrap;
  transition:background .16s, border-color .16s, transform .12s, opacity .16s;
}
.btn:active{transform:scale(.97); background:var(--surface-3)}
.btn.pri{background:var(--accent); border-color:var(--accent); color:#fff; box-shadow:0 8px 20px -12px rgba(255,106,43,.9)}
.btn.pri:active{background:var(--accent-deep)}
.btn.grn{background:var(--green); border-color:var(--green); color:#fff}
.btn.ghost{background:transparent; border-color:transparent; color:var(--text-2)}
.btn.dan{color:var(--danger); border-color:var(--line-2)}
.btn.dan:active{background:var(--danger-soft)}
.btn.block{width:100%}
.btn[disabled]{opacity:.45}

/* 卡片 / 分组 */
.card{
  background:var(--surface); border-radius:var(--r-lg); box-shadow:var(--shadow-1);
  overflow:hidden;
}
.card + .card{margin-top:14px}
.card .row{
  display:flex; align-items:center; gap:12px; padding:15px var(--pad); min-height:var(--tap);
  border-bottom:1px solid var(--line);
}
.card .row:last-child{border-bottom:none}
.card .row .lb{flex:1; min-width:0}
.card .row .lb b{display:block; font-weight:600; font-size:var(--fs-body)}
.card .row .lb span{display:block; color:var(--muted); font-size:var(--fs-sub); margin-top:2px; line-height:1.5}
.card .row .val{color:var(--muted); font-size:var(--fs-sub); flex:0 0 auto}
.card .row.tap:active{background:var(--surface-2)}
.seg-title{
  font-size:var(--fs-sub); color:var(--muted); font-weight:600; letter-spacing:.08em;
  padding:22px 4px 9px;
}
.seg-title:first-child{padding-top:6px}

/* 表单 */
.field{padding:14px var(--pad); border-bottom:1px solid var(--line)}
.field:last-child{border-bottom:none}
.field > label{display:block; font-size:var(--fs-sub); color:var(--muted); margin-bottom:8px}
.field input[type=text],.field textarea,.field select{
  width:100%; border:none; background:transparent; outline:none;
  font-size:var(--fs-body); line-height:1.7; padding:0; color:var(--text);
}
.field textarea{resize:none; min-height:74px; font-family:inherit}
.field input::placeholder,.field textarea::placeholder{color:var(--faint)}
.field.big input[type=text]{font-size:calc(var(--fs-body) + 2px); font-weight:600}

/* 空态 */
.empty{
  text-align:center; padding:clamp(30px,8vw,56px) var(--pad); color:var(--muted);
}
.empty .seal{
  width:clamp(64px,16vw,84px); height:clamp(64px,16vw,84px); border-radius:50%; margin:0 auto 18px;
  display:flex; align-items:center; justify-content:center; color:#fff; font-size:clamp(26px,7vw,34px);
  font-family:"Songti SC",serif; font-weight:700;
  background:linear-gradient(150deg,#7d9c64,#4e6b41);
  box-shadow:0 16px 32px -16px rgba(63,90,55,.75), inset 0 0 0 2px rgba(255,255,255,.3);
}
.empty h3{margin:0 0 8px; font-size:calc(var(--fs-title) + 2px); color:var(--text); font-weight:700; letter-spacing:.1em; font-family:"Songti SC",serif}
.empty p{margin:0 auto 22px; max-width:340px; font-size:var(--fs-sub); line-height:1.9}

/* ================= 首页 ================= */
.hero{padding:calc(10px + var(--safe-t)) var(--pad) 2px}
.hero h1{
  margin:0; font-size:var(--fs-hero); font-weight:700; letter-spacing:.01em;
  display:flex; align-items:center; gap:9px;
}
.hero p{margin:7px 0 0; color:var(--muted); font-size:var(--fs-sub); display:flex; flex-wrap:wrap; gap:6px 9px}
.hero p i{width:1px; height:11px; background:var(--line-2); align-self:center; display:inline-block}

.book{
  position:relative; display:flex; gap:14px; padding:14px; border-radius:var(--r-lg);
  background:var(--surface); box-shadow:var(--shadow-1); margin-bottom:12px;
  transition:transform .18s cubic-bezier(.2,.9,.3,1.1), box-shadow .18s;
}
.book:active{transform:scale(.985); box-shadow:var(--shadow-2)}
.book .cv{
  flex:0 0 auto; width:clamp(66px,14vw,86px); aspect-ratio:3/4.2; border-radius:8px; overflow:hidden;
  background:linear-gradient(155deg,#7d9c64,#4e6b41); background-size:cover; background-position:center;
  display:flex; align-items:center; justify-content:center; position:relative;
  writing-mode:vertical-rl; text-orientation:upright; letter-spacing:.16em;
  font-family:"Songti SC",serif; font-weight:700; color:#fff; font-size:clamp(13px,2.9vw,16px);
  padding:11px 0; box-shadow:0 10px 20px -12px rgba(35,30,22,.55);
}
.book .cv span{max-height:88%; overflow:hidden; text-shadow:0 1px 3px rgba(0,0,0,.35)}
.book .cv.has-img span{
  writing-mode:horizontal-tb; letter-spacing:0; align-self:flex-end; width:100%;
  padding:3px 4px 5px; font-size:10px; font-weight:400; text-align:center;
  background:linear-gradient(transparent,rgba(18,14,8,.62));
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-family:inherit;
}
.book .info{flex:1; min-width:0; display:flex; flex-direction:column; justify-content:center}
.book .info .bt{
  font-size:calc(var(--fs-body) + 2.5px); font-weight:700; margin-bottom:7px;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.book .info .meta{display:flex; flex-wrap:wrap; align-items:center; gap:5px 9px; color:var(--muted); font-size:var(--fs-sub)}
.book .info .meta .pill{border:1px solid var(--line-2); border-radius:20px; padding:1px 8px; font-size:11.5px}
.book .info .intro{
  margin-top:8px; color:var(--muted); font-size:var(--fs-sub); line-height:1.6;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
}
.book .go{
  position:absolute; right:12px; bottom:12px; width:40px; height:40px; border-radius:50%;
  background:var(--accent-soft); color:var(--accent-deep); display:flex; align-items:center; justify-content:center;
}
.book .go svg{width:19px; height:19px}
.addcard{
  display:flex; align-items:center; justify-content:center; gap:11px;
  min-height:clamp(84px,18vw,104px); border-radius:var(--r-lg);
  border:1.5px dashed var(--line-2); background:var(--surface-2); color:var(--text-2);
  font-weight:600;
}
.addcard:active{background:var(--surface-3)}
.addcard .plus{
  width:38px; height:38px; border-radius:50%; background:var(--green-soft); color:var(--green);
  display:flex; align-items:center; justify-content:center; font-size:20px;
}
.addcard small{display:block; font-size:var(--fs-sub); color:var(--muted); font-weight:400; margin-top:2px}
.fab{
  position:fixed; right:max(calc(var(--pad) + var(--safe-r)), 16px);
  bottom:calc(var(--nav-h) + var(--safe-b) + clamp(14px,3vw,22px));
  z-index:20; display:flex; align-items:center; gap:8px; height:var(--tap);
  padding:0 20px; border-radius:26px; background:var(--accent); color:#fff; font-weight:600;
  box-shadow:0 14px 30px -10px rgba(255,106,43,.85), 0 2px 8px rgba(35,30,22,.14);
}
.fab:active{background:var(--accent-deep); transform:scale(.97)}
.fab svg{width:20px; height:20px}
/* 书架为空时不需要悬浮按钮（空态里已有引导） */
body.no-books .fab{display:none}

/* ================= 写作页 ================= */
#s-write{background:var(--read-bg); color:var(--read-fg)}
.wbar{
  flex:0 0 auto; display:flex; align-items:center; gap:4px;
  padding:calc(4px + var(--safe-t)) 6px 4px; background:var(--surface);
  border-bottom:1px solid var(--line); z-index:5;
}
.wbar .wt{
  flex:1; min-width:0; text-align:center; font-size:var(--fs-sub); color:var(--muted);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding:0 4px;
}
.paper{flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; touch-action:pan-y}
.paper-in{max-width:760px; margin:0 auto; padding:clamp(18px,4vw,34px) clamp(16px,4.6vw,30px) 45vh}
.ch-title{
  width:100%; border:none; background:transparent; outline:none; color:inherit;
  font-family:"Songti SC","STSong",Georgia,serif; font-weight:700;
  font-size:clamp(21px,4.6vw,29px); line-height:1.35; padding:0 0 10px;
}
.ch-title::placeholder{color:var(--faint)}
.ch-sub{display:flex; align-items:center; gap:10px; color:var(--muted); font-size:var(--fs-sub); margin-bottom:clamp(14px,3vw,22px)}
.ch-sub i{width:26px; height:2px; border-radius:2px; background:var(--accent); opacity:.8; display:block}
#editor{
  outline:none; font-family:var(--read-font); font-size:var(--read-fs); line-height:var(--read-lh);
  white-space:pre-wrap; word-break:break-word; caret-color:var(--accent);
  min-height:50vh;
}
#editor:empty::before{content:"从这里写下第一句…"; color:var(--faint)}
.wstat{
  flex:0 0 auto; display:flex; align-items:center; gap:clamp(8px,2.6vw,16px);
  padding:9px var(--pad) calc(9px + var(--safe-b));
  background:var(--surface); border-top:1px solid var(--line);
  color:var(--muted); font-size:var(--fs-sub); white-space:nowrap; overflow:hidden;
}
.wstat b{color:var(--text); font-weight:600; font-variant-numeric:tabular-nums}
.wstat .st{margin-left:auto; display:inline-flex; align-items:center; gap:6px}
.wstat .st i{width:6px; height:6px; border-radius:50%; background:var(--faint); display:block}
.wstat .st.saving i{background:var(--accent)}
.wstat .st.saved i{background:#6f9a58}

/* 抽屉（目录 / 设置 / 人物详情 都用它：从下往上滑出，占满，一屏一件事） */
.sheet{
  position:fixed; inset:0; z-index:60; display:flex; flex-direction:column;
  background:var(--bg); transform:translateY(100%);
  transition:transform .3s cubic-bezier(.32,.92,.28,1);
  padding-left:var(--safe-l); padding-right:var(--safe-r);
}
.sheet.on{transform:none}
.sheet .bar{background:var(--surface)}
.sheet .body{flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; touch-action:pan-y}

/* ================= 目录（竖排一卷一章，简洁） ================= */
.toc-wrap{padding:10px var(--pad) 30px}
.vol-head{
  display:flex; align-items:center; gap:4px; padding:8px 0 8px 2px;
}
.vol-head .nm{
  flex:1; min-width:0; font-size:calc(var(--fs-body) + 1px); font-weight:700;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.vol-head .ct{color:var(--muted); font-size:var(--fs-sub); flex:0 0 auto}
.vol-head .mini{
  width:38px; height:38px; border-radius:11px; display:flex; align-items:center; justify-content:center;
  color:var(--muted); flex:0 0 auto;
}
.vol-head .mini svg{width:18px; height:18px}
.vol-head .mini:active{background:var(--surface-3)}
.vol-head .mini.dan{color:var(--danger)}
.ch{
  display:flex; align-items:center; gap:8px; padding:0 4px 0 14px;
  min-height:calc(var(--tap) + 4px); border-radius:14px; margin-left:6px;
  border-left:2px solid var(--line-2); background:transparent;
  transition:background .16s;
}
.ch:active{background:var(--surface-2)}
.ch.cur{background:var(--accent-soft); border-left-color:var(--accent)}
.ch.cur .nm{color:var(--accent-deep); font-weight:600}
.ch .nm{
  flex:1; min-width:0; font-size:var(--fs-body);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.ch .wc{color:var(--muted); font-size:var(--fs-sub); flex:0 0 auto; font-variant-numeric:tabular-nums}
.ch .mini{
  width:38px; height:38px; border-radius:11px; display:flex; align-items:center; justify-content:center;
  color:var(--muted); flex:0 0 auto;
}
.ch .mini svg{width:18px; height:18px}
.ch .mini:active{background:var(--surface-3)}
.ch .mini.dan{color:var(--danger)}
.vol-group + .vol-group{margin-top:18px}
.toc-new{
  margin:16px 0 0; display:flex; gap:10px;
}
.toc-new .btn{flex:1}

/* ================= 世界观 ================= */
.tabs{
  flex:0 0 auto; display:flex; gap:8px; padding:10px var(--pad) 12px;
  background:var(--bg); border-bottom:1px solid var(--line); overflow-x:auto; scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto; height:38px; padding:0 16px; border-radius:19px; display:inline-flex; align-items:center; gap:6px;
  background:var(--surface); border:1px solid var(--line-2); color:var(--text-2);
  font-size:var(--fs-sub); font-weight:500; transition:all .16s;
}
.chip.on{background:var(--green); border-color:var(--green); color:#fff; font-weight:600}
.chip:active{transform:scale(.96)}

/* 人物：一屏一页（列表 / 详情） */
.p-list{padding:6px var(--pad) 30px}
.p-item{
  display:flex; align-items:center; gap:13px; padding:12px; margin-bottom:10px;
  background:var(--surface); border-radius:var(--r-md); box-shadow:var(--shadow-1);
  transition:transform .16s, box-shadow .16s;
}
.p-item:active{transform:scale(.985)}
.p-item .av{
  flex:0 0 auto; width:clamp(46px,10vw,56px); height:clamp(46px,10vw,56px); border-radius:50%;
  background:var(--green-soft) center/cover; color:var(--green);
  display:flex; align-items:center; justify-content:center; font-size:calc(var(--fs-body) + 3px);
  font-weight:600; font-family:"Songti SC",serif;
}
.p-item .tx{flex:1; min-width:0}
.p-item .tx b{display:block; font-size:calc(var(--fs-body) + 1px); font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.p-item .tx span{display:block; color:var(--muted); font-size:var(--fs-sub); margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.p-item .arw{color:var(--faint); flex:0 0 auto}
.p-item .arw svg{width:18px; height:18px}

.p-detail{padding:6px var(--pad) 34px}
.p-hero{display:flex; flex-direction:column; align-items:center; gap:13px; padding:18px 0 22px}
.p-hero .big{
  width:clamp(96px,24vw,124px); height:clamp(96px,24vw,124px); border-radius:50%;
  background:var(--surface-2) center/cover; border:1.5px dashed var(--line-2); color:var(--faint);
  display:flex; align-items:center; justify-content:center; font-size:var(--fs-sub); text-align:center;
  font-family:"Songti SC",serif;
}
.p-hero .big.has{border-style:solid; border-color:var(--line)}
.p-hero .hint{color:var(--muted); font-size:var(--fs-sub)}

/* ================= 设置 ================= */
.set-wrap{padding:6px var(--pad) 40px}
.swatches{display:flex; gap:11px; flex-wrap:wrap; padding:15px var(--pad)}
.sw{
  width:clamp(50px,12vw,60px); height:clamp(50px,12vw,60px); border-radius:15px; position:relative;
  border:2px solid var(--line-2); display:flex; align-items:flex-end; justify-content:center; overflow:hidden;
  transition:transform .16s, border-color .16s, box-shadow .16s;
}
.sw span{width:100%; text-align:center; font-size:10.5px; padding:3px 0; background:rgba(30,22,14,.3); color:#fff}
.sw.lt span{background:rgba(255,255,255,.6); color:#4a453d}
.sw.on{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
.sw:active{transform:scale(.94)}
.sw.custom{background:conic-gradient(#e06c5a,#e0b45a,#6ea86c,#5a8fd0,#a06cd0,#e06c5a)}
.sw.custom input{position:absolute; inset:0; width:100%; height:100%; opacity:0}
.slider-row{display:flex; align-items:center; gap:14px; padding:15px var(--pad); border-bottom:1px solid var(--line)}
.slider-row:last-child{border-bottom:none}
.slider-row > label{flex:0 0 62px; font-size:var(--fs-sub); color:var(--muted)}
.slider-row input[type=range]{
  -webkit-appearance:none; appearance:none; flex:1; height:6px; border-radius:20px; background:var(--line-2); outline:none;
}
.slider-row input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none; width:26px; height:26px; border-radius:50%; background:#fff;
  border:3px solid var(--accent); box-shadow:0 2px 6px rgba(0,0,0,.22); cursor:pointer;
}
.slider-row .val{flex:0 0 54px; text-align:right; color:var(--muted); font-size:var(--fs-sub); font-variant-numeric:tabular-nums}
.switch{
  position:relative; width:52px; height:31px; border-radius:20px; background:var(--line-2);
  flex:0 0 auto; transition:background .2s; border:none;
}
.switch::after{
  content:""; position:absolute; top:3px; left:3px; width:25px; height:25px; border-radius:50%;
  background:#fff; box-shadow:0 1px 4px rgba(0,0,0,.28); transition:transform .2s;
}
.switch.on{background:var(--green)}
.switch.on::after{transform:translateX(21px)}

/* ================= 弹窗 / 提示 ================= */
.mask{
  position:fixed; inset:0; z-index:80; background:rgba(24,20,15,.46);
  display:flex; align-items:flex-end; justify-content:center;
  animation:fade .18s ease; backdrop-filter:blur(2px);
}
@keyframes fade{from{opacity:0}}
.dialog{
  width:100%; max-width:560px; max-height:90dvh; display:flex; flex-direction:column;
  background:var(--surface); border-radius:var(--r-xl) var(--r-xl) 0 0;
  padding-bottom:var(--safe-b); animation:up .28s cubic-bezier(.32,.92,.28,1);
}
@keyframes up{from{transform:translateY(28px); opacity:.6}}
.dialog .dh{
  flex:0 0 auto; display:flex; align-items:center; gap:10px;
  padding:16px var(--pad) 12px; border-bottom:1px solid var(--line);
}
.dialog .dh .t{flex:1; text-align:center; font-size:calc(var(--fs-body) + 2px); font-weight:700}
.dialog .dh .x{width:var(--tap); height:38px; border-radius:12px; display:flex; align-items:center; justify-content:center; color:var(--text-2)}
.dialog .dh .x svg{width:20px; height:20px}
.dialog .dh .ok{padding:0 12px; height:38px; border-radius:12px; color:var(--accent); font-weight:700; font-size:calc(var(--fs-body) + 1px)}
.dialog .db{flex:1; min-height:0; overflow-y:auto; touch-action:pan-y}
.dialog .df{padding:14px var(--pad) 18px; display:flex; gap:10px}
.dialog .df .btn{flex:1}
.dlg-field{padding:14px var(--pad); border-bottom:1px solid var(--line)}
.dlg-field:last-child{border-bottom:none}
.dlg-field .lb{display:flex; align-items:baseline; gap:8px; font-size:var(--fs-sub); color:var(--muted); margin-bottom:8px}
.dlg-field .lb .cnt{margin-left:auto; color:var(--faint); font-variant-numeric:tabular-nums}
.dlg-field input,.dlg-field textarea{
  width:100%; border:none; outline:none; background:transparent; font-size:var(--fs-body);
  line-height:1.7; resize:none; font-family:inherit;
}
.dlg-field textarea{min-height:88px}
.dlg-field input::placeholder,.dlg-field textarea::placeholder{color:var(--faint)}
.cover-pick{display:flex; flex-direction:column; align-items:center; gap:10px; padding:20px 0 16px; background:var(--surface-2)}
.cover-pick .cv{
  width:clamp(90px,22vw,112px); aspect-ratio:3/4; border-radius:8px; position:relative; overflow:hidden;
  background:#fff center/cover; box-shadow:0 14px 28px -16px rgba(35,30,22,.6), 0 0 0 1px var(--line);
  display:flex; align-items:center; justify-content:center;
  writing-mode:vertical-rl; text-orientation:upright; letter-spacing:.18em;
  font-family:"Songti SC",serif; font-weight:700; font-size:15px; color:#3d3a34; padding:12px 0;
}
.cover-pick .cv .ov{
  position:absolute; inset:0; background:rgba(24,20,15,.42); color:#fff; display:flex; align-items:center;
  justify-content:center; font-size:var(--fs-sub); writing-mode:horizontal-tb; letter-spacing:0;
}
.cover-pick .cap{color:var(--muted); font-size:var(--fs-sub)}
.cover-pick .cv.has-img span.text{color:#fff; text-shadow:0 1px 4px rgba(0,0,0,.6); position:relative; z-index:1}

.toast-wrap{
  position:fixed; left:50%; transform:translateX(-50%); bottom:calc(var(--nav-h) + var(--safe-b) + 22px);
  z-index:120; display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none; width:max-content; max-width:92vw;
}
.toast{
  background:rgba(28,24,18,.94); color:#f8f4ec; padding:11px 20px; border-radius:22px;
  font-size:var(--fs-sub); box-shadow:0 14px 30px -14px rgba(0,0,0,.6);
  animation:tin .22s cubic-bezier(.2,.9,.3,1.1); text-align:center;
}
.toast.ok{background:rgba(63,90,55,.96)}
.toast.warn{background:rgba(160,78,34,.96)}
@keyframes tin{from{opacity:0; transform:translateY(12px)}}

/* 遮罩关闭按钮（抽屉/弹窗统一） */
.sheet-mask{position:fixed; inset:0; z-index:55; background:rgba(24,20,15,.34); opacity:0; pointer-events:none; transition:opacity .28s}
.sheet-mask.on{opacity:1; pointer-events:auto}

/* 横屏：内容居中，阅读区更宽（仍然一屏一件事，不分栏） */
@media (min-aspect-ratio:1/1){
  .paper-in{max-width:820px}
  .hero{padding-top:calc(16px + var(--safe-t))}
}
/* 更宽的 iPad（横屏或大屏）：列表两列，减少滚动 */
@media (min-width:900px){
  .book-list{display:grid; grid-template-columns:1fr 1fr; gap:12px}
  .book{margin-bottom:0}
  .addcard{grid-column:1/-1}
  .p-list{display:grid; grid-template-columns:1fr 1fr; gap:12px; align-content:start}
  .p-item{margin-bottom:0}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important; transition-duration:.06s !important}
}

          </div>

  <section class="screen" id="s-set">

<script>
'use strict';
/* =========================================================================
   0 · 小工具
   ========================================================================= */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.prototype.slice.call((r || document).querySelectorAll(s));
const A = (v, d) => (v === 0 || v ? v : d);
const uid = p => p + '_' + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-3);
const esc = v => String(A(v, '')).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = v => { const n = parseInt(v, 10); return isNaN(n) ? 0 : n; };
const fnum = n => String(num(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const pad2 = n => (n < 10 ? '0' : '') + n;
const todayKey = (d) => { d = d || new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); };
function countWords(t) {
  const s = String(A(t, ''));
  const cjk = s.match(/[\u3400-\u4dbf\u4e00-\u9fff\u3040-\u30ff\uac00-\ud7af]/g);
  const w = s.match(/[A-Za-z0-9_'-]+/g);
  return (cjk ? cjk.length : 0) + (w ? w.length : 0);
}
function initials(t) { const s = String(A(t, '书')).trim(); return s ? s.slice(0, 1) : '书'; }
function fmtTime(ts) {
  if (!ts) return '尚未编辑';
  const d = new Date(ts), now = new Date(), diff = now - d;
  if (diff < 60000) return '刚刚';
  if (diff < 3600000) return Math.floor(diff / 60000) + ' 分钟前';
  if (todayKey(d) === todayKey(now)) return '今天 ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  const y = new Date(now.getTime() - 86400000);
  if (todayKey(d) === todayKey(y)) return '昨天';
  return (d.getFullYear() === now.getFullYear() ? '' : d.getFullYear() + '年') + (d.getMonth() + 1) + '月' + d.getDate() + '日';
}
function toast(msg, type) {
  const box = $('#toasts'); if (!box) return;
  const el = document.createElement('div');
  el.className = 'toast' + (type ? ' ' + type : '');
  el.textContent = msg;
  box.appendChild(el);
  setTimeout(() => { el.style.transition = 'opacity .3s'; el.style.opacity = '0'; setTimeout(() => el.remove(), 320); }, 2100);
}
function download(name, text, mime) {
  try {
    const url = URL.createObjectURL(new Blob([text], { type: (mime || 'text/plain') + ';charset=utf-8' }));
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    return true;
  } catch (e) { toast('导出失败：' + e.message, 'warn'); return false; }
}
/* 底部弹窗：移动端用底部抽屉式，符合手指习惯 */
function dialog(opts) {
  const mask = document.createElement('div');
  mask.className = 'mask';
  const cancel = () => { mask.style.opacity = '0'; setTimeout(() => mask.remove(), 180); };
  mask.innerHTML =
    '<div class="dialog">' +
      '<div class="dh">' +
        '<button class="x" data-x><svg class="ic" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>' +
        '<span class="t">' + esc(A(opts.title, '')) + '</span>' +
        '<button class="ok" data-ok>' + esc(A(opts.okText, '完成')) + '</button>' +
      '</div>' +
      '<div class="db">' + A(opts.body, '') + '</div>' +
      (opts.footer ? '<div class="df">' + opts.footer + '</div>' : '') +
    '</div>';
  $('#modal-root').appendChild(mask);
  mask.addEventListener('click', e => {
    if (e.target === mask) return cancel();
    if (e.target.closest('[data-x]')) return cancel();
    if (e.target.closest('[data-ok]')) {
      const r = opts.onOk ? opts.onOk(mask) : true;
      if (r !== false) cancel();
      return;
    }
    const b = e.target.closest('[data-act]');
    if (b && opts.onAct) opts.onAct(mask, b.dataset.act, b);
  });
  const first = mask.querySelector('input,textarea');
  if (first) setTimeout(() => { first.focus(); try { first.select(); } catch (e) { } }, 320);
  return mask;
}
function confirmDlg(title, desc, okText, onOk) {
  return dialog({
    title: title, okText: '确定',
    body: '<div class="dlg-field"><div style="color:var(--muted);font-size:var(--fs-sub);line-height:1.85">' + esc(desc) + '</div></div>',
    footer: '<button class="btn" data-x>取消</button><button class="btn dan" data-ok>' + esc(A(okText, '确定')) + '</button>',
    onOk: onOk
  });
}
/* 图片选择 + 压缩 */
let _pickCb = null;
function pickImage(cb, maxSide) {
  _pickCb = { cb: cb, max: maxSide || 800 };
  const f = $('#f-img'); f.value = ''; f.click();
}
$('#f-img').addEventListener('change', function () {
  const file = this.files && this.files[0];
  const job = _pickCb; _pickCb = null;
  if (!file || !job) return;
  const fr = new FileReader();
  fr.onload = () => {
    const img = new Image();
    img.onload = () => {
      const sc = Math.min(1, job.max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(img.width * sc));
      c.height = Math.max(1, Math.round(img.height * sc));
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      try { job.cb(c.toDataURL('image/jpeg', .86)); } catch (e) { toast('图片处理失败', 'warn'); }
    };
    img.onerror = () => toast('这不是有效的图片', 'warn');
    img.src = fr.result;
  };
  fr.onerror = () => toast('读取失败', 'warn');
  fr.readAsDataURL(file);
});

/* =========================================================================
   1 · 数据层（沿用原来的存储格式，iPad 打开就能看到已有作品）
   ========================================================================= */
const LS = { lib: 'motebook.library.v1', prefs: 'motebook.prefs.v1', stats: 'motebook.stats.v1' };
function lsRead(k, fb) { try { const r = localStorage.getItem(k); return r ? JSON.parse(r) : fb; } catch (e) { return fb; } }
function jsonSafe(k, v) {
  if (k && k.charAt(0) === '_') return undefined;
  if (typeof v === 'function') return undefined;
  if (typeof HTMLImageElement !== 'undefined' && v instanceof HTMLImageElement) return undefined;
  return v;
}
function lsWrite(k, v) { try { localStorage.setItem(k, JSON.stringify(v, jsonSafe)); } catch (e) { toast('存储写入失败（可能已满）', 'warn'); } }

function defaultRead() {
  return { bg:'#fbf8f1', fg:'#2c2721', font:'宋体', fs:18, lh:1.9, br:100, indent:true, theme:'light' };
}
function newChapter(title) {
  const t = Date.now();
  return { id: uid('ch'), title: A(title, '新章节'), content: '', wordCount: 0, createdAt: t, updatedAt: t };
}
function newVolume(name) { return { id: uid('vol'), name: A(name, '新的一卷'), order: 0, chapters: [] }; }
function newBook(title, intro, hero, cover) {
  const t = Date.now(), v = newVolume('第一卷');
  v.chapters.push(newChapter('第一章'));
  return {
    id: uid('book'), title: A(title, '未命名'), intro: A(intro, ''), protagonist: A(hero, ''),
    cover: A(cover, ''), createdAt: t, updatedAt: t, totalWords: 0, volumes: [v],
    worldbuilding: normWorld(null), settings: defaultRead()
  };
}
function normWorld(w) {
  w = w || {};
  return {
    worldSetting: A(w.worldSetting, ''),
    characters: (Array.isArray(w.characters) ? w.characters : []).map(c => ({
      id: A(c.id, uid('char')), name: A(c.name, ''), avatar: A(c.avatar, ''), gender: A(c.gender, ''),
      age: A(c.age, ''), appearance: A(c.appearance, ''), personality: A(c.personality, ''),
      background: A(c.background, ''), ability: A(c.ability, ''), notes: A(c.notes, '')
    })),
    map: A(w.map, ''), forceMap: A(w.forceMap, ''), extraImage: A(w.extraImage, '')
  };
}
function normBook(b) {
  const t = Date.now();
  b = b || {};
  const vols = (Array.isArray(b.volumes) && b.volumes.length ? b.volumes : [newVolume('第一卷')]).map((v, i) => ({
    id: A(v.id, uid('vol')), name: A(v.name, '第' + (i + 1) + '卷'), order: num(A(v.order, i)),
    chapters: (Array.isArray(v.chapters) ? v.chapters : []).map(c => ({
      id: A(c.id, uid('ch')), title: A(c.title, '未命名章节'), content: A(c.content, ''),
      wordCount: num(c.wordCount), createdAt: A(c.createdAt, t), updatedAt: A(c.updatedAt, t)
    }))
  }));
  vols.sort((a, c) => a.order - c.order);
  vols.forEach((v, i) => { v.order = i; });
  const s = Object.assign(defaultRead(), b.settings || {});
  if (!/^#[0-9a-fA-F]{6}$/.test(s.bg)) s.bg = '#fbf8f1';
  if (!/^#[0-9a-fA-F]{6}$/.test(s.fg)) s.fg = '#2c2721';
  return {
    id: A(b.id, uid('book')), title: A(b.title, '未命名'), intro: A(b.intro, ''), protagonist: A(b.protagonist, ''),
    cover: A(b.cover, ''), createdAt: A(b.createdAt, t), updatedAt: A(b.updatedAt, t),
    totalWords: num(b.totalWords), volumes: vols, worldbuilding: normWorld(b.worldbuilding), settings: s
  };
}
let DB = { books: (lsRead(LS.lib, null) || {}).books || [] };
DB.books = DB.books.map(normBook);
let PREFS = Object.assign({ last: '', theme: 'light', tab: 'world' }, lsRead(LS.prefs, {}));
let STATS = (function (raw) {
  raw = raw || {};
  const st = { date: A(raw.date, todayKey()), wordCount: num(raw.wordCount), perBook: raw.perBook || {}, log: raw.log || {}, base: raw.baseline || raw.base || {} };
  if (st.date !== todayKey()) { st.log[st.date] = A(st.log[st.date], 0) + st.wordCount; st.date = todayKey(); st.wordCount = 0; st.perBook = {}; }
  return st;
})(lsRead(LS.stats, null));

let saveTimer = 0;
function save(now) {
  clearTimeout(saveTimer);
  const go = () => { lsWrite(LS.lib, DB); lsWrite(LS.prefs, PREFS); lsWrite(LS.stats, STATS); };
  if (now) return go();
  saveTimer = setTimeout(go, 500);
}
const book = id => DB.books.filter(b => b.id === id)[0] || null;
function chapters(b) { const o = []; (b ? b.volumes : []).forEach(v => v.chapters.forEach(c => o.push({ v: v, c: c }))); return o; }
function findCh(b, id) { let r = null; (b ? b.volumes : []).forEach(v => v.chapters.forEach(c => { if (c.id === id) r = c; })); return r; }
function findVolOf(b, chId) { return (b ? b.volumes : []).filter(v => v.chapters.some(c => c.id === chId))[0] || null; }
function todayWords() {
  if (STATS.date !== todayKey()) { STATS.log[STATS.date] = A(STATS.log[STATS.date], 0) + STATS.wordCount; STATS.date = todayKey(); STATS.wordCount = 0; STATS.perBook = {}; }
  return STATS.wordCount;
}
function addWords(bookId, delta) {
  if (!bookId || !delta) return;
  todayWords();
  STATS.wordCount = Math.max(0, STATS.wordCount + delta);
  STATS.perBook[bookId] = Math.max(0, num(STATS.perBook[bookId]) + delta);
  save();
}
const totalWords = () => DB.books.reduce((s, b) => s + num(b.totalWords), 0);
const chCount = b => b.volumes.reduce((s, v) => s + v.chapters.length, 0);
function reCount(b) {
  if (live && live.bookId === b.id) { const c = findCh(b, live.chId); if (c) c.wordCount = live.words; }
  b.totalWords = b.volumes.reduce((s, v) => s + v.chapters.reduce((x, c) => x + num(c.wordCount), 0), 0);
  return b.totalWords;
}

const state = { screen: 'home', bookId: '', chId: '', charId: '', worldTab: 'world', sheet: '' };
let live = null;   // { bookId, chId, raw, words, dirty, commit }

function curBook() { return book(state.bookId); }
function curCh() { const b = curBook(); return b && state.chId ? findCh(b, state.chId) : null; }

/* 顶部/底部导航切换 */
function go(screen) {
  if (screen === 'write' && !state.chId) {
    const b = curBook() || DB.books[0];
    if (!b) { toast('先新建一部作品', 'warn'); return; }
    if (b.id !== state.bookId) openBook(b.id);
    const first = chapters(b)[0];
    if (!first) { toast('这本书还没有章节', 'warn'); return; }
    state.chId = first.c.id;
    loadChapter();
  }
  if (screen === 'world' || screen === 'set') { if (!curBook() && DB.books[0]) openBook(DB.books[0].id, true); }
  state.screen = screen;
  $$('.screen').forEach(s => s.classList.toggle('on', s.id === 's-' + screen));
  $$('#nav button').forEach(b => b.classList.toggle('on', b.dataset.go === screen));
  if (screen === 'home') { renderHome(); }
  if (screen === 'world') renderWorld();
  if (screen === 'set') renderSettings();
  if (screen === 'write') { if (!live && state.chId) loadChapter(); updateStat(); setTimeout(focusEnd, 30); }
}
function openBook(id, keepScreen) {
  commitLive();
  const b = book(id); if (!b) return;
  state.bookId = id;
  PREFS.last = id;
  const first = chapters(b)[0];
  state.chId = first ? first.c.id : '';
  state.charId = (b.worldbuilding.characters[0] || {}).id || '';
  applyRead(b);
  /* 先把章节内容灌进编辑器，再切屏幕 —— 否则切过去的瞬间编辑器是空的，开头几个字会丢 */
  if (state.chId) loadChapter();
  save();
  if (!keepScreen) go('write'); else { renderWorld(); renderSettings(); }
}
function commitLive() {
  if (!live) return;
  const b = book(live.bookId); if (!b) { live = null; return; }
  const c = findCh(b, live.chId);
  if (c) { c.content = live.raw; c.wordCount = countWords(live.raw); c.updatedAt = Date.now(); }
  reCount(b);
  b.updatedAt = Date.now();
  live.dirty = false;
  save();
  markSaved();
}

function applyRead(b) {

function loadChapter() {

  if (!b || !c) return;

  $('#ch-title').value = c.title;
  const v = findVolOf(b, c.id);

  updateMeta();
  updateStat();
}
function updateMeta() {
  const b = curBook(), c = curCh();
  if (!b || !c) { $('#w-meta').textContent = '未选择章节'; return; }
  const v = findVolOf(b, c.id);
  $('#w-meta').textContent = (v ? v.name + ' · ' : '') + c.title;

function updateStat() {
  const w = live ? live.words : 0;

let speedLog = [];
function tickSpeed() {
  const el = $('#st-speed'); if (!el) return;
  if (!live || !speedLog.length) { el.textContent = '0'; return; }
  const now = Date.now(), f = speedLog[0];
  const d = speedLog[speedLog.length - 1].w - f.w;
  const span = Math.max((now - f.t) / 60000, 1 / 60);
  el.textContent = String(d <= 0 ? 0 : clamp(Math.round(d / span), 0, 400));
}
function markSaved() {
  const box = $('#st-save'), t = $('#st-save-t');
  if (!box) return;
  box.classList.remove('saving'); box.classList.add('saved');
  if (t) t.textContent = '已保存 ' + pad2(new Date().getHours()) + ':' + pad2(new Date().getMinutes());
}
function markSaving() {
  const box = $('#st-save'), t = $('#st-save-t');
  if (!box) return;
  box.classList.remove('saved'); box.classList.add('saving');
  if (t) t.textContent = '正在输入…';
}
const editor = $('#editor');
editor.addEventListener('input', () => {
  if (!live) return;
  const prev = live.words;
  live.raw = String(editor.innerText || '').replace(/\u2028/g, '\n');
  live.dirty = true;
  live.words = countWords(live.raw);
  addWords(live.bookId, live.words - prev);
  const b = book(live.bookId);
  if (b) { const c = findCh(b, live.chId); if (c) c.wordCount = live.words; }
  updateStat(); updateMeta();
  speedLog.push({ t: Date.now(), w: live.words });
  while (speedLog.length > 2 && Date.now() - speedLog[0].t > 60000) speedLog.shift();
  tickSpeed();
  markSaving();
  clearTimeout(live.commit);
  live.commit = setTimeout(() => { commitLive(); }, 1500);
});

  e.preventDefault();

editor.addEventListener('blur', () => { if (live && live.dirty) commitLive(); });

function importJson(file) {
  const fr = new FileReader();
  fr.onload = () => {
    let data;
    try { data = JSON.parse(fr.result); } catch (e) { toast('不是有效的备份文件', 'warn'); return; }
    const books = Array.isArray(data.books) ? data.books : (Array.isArray(data) ? data : null);
    if (!books) { toast('备份格式无法识别', 'warn'); return; }
    confirmDlg('导入备份', '将导入 ' + books.length + ' 部作品，覆盖当前全部内容。当前 ' + DB.books.length + ' 部作品会被替换，确定吗？', '覆盖导入', () => {
      DB = { books: books.map(normBook) };
      if (data.stats) STATS = Object.assign(STATS, data.stats);
      state.bookId = ''; state.chId = ''; live = null;
      save(true);
      go('home');
      toast('导入完成，共 ' + DB.books.length + ' 本', 'ok');
    });
  };
  fr.readAsText(file);
}

    if (a === 'bg') return pickBg(num(el.dataset.i));
    if (a === 'theme') { const b = curBook(); if (!b) return toast('先新建一部作品', 'warn'); const d = b.settings.theme === 'dark'; b.settings.theme = d ? 'light' : 'dark'; applyRead(b); renderSettings(); save(); return toast(d ? '已切换日间' : '已开启夜间护眼', 'ok'); }
    if (a === 'indent') { const b = curBook(); if (!b) return; b.settings.indent = !b.settings.indent; applyRead(b); renderSettings(); save(); return; }
    if (a === 'backup') return exportAll();
    if (a === 'restore') { const f = $('#f-json'); f.value = ''; f.click(); return; }
  }
  if (e.target.closest('#sw-theme')) { const b = curBook(); if (!b) return toast('先新建一部作品', 'warn'); const d = b.settings.theme === 'dark'; b.settings.theme = d ? 'light' : 'dark'; applyRead(b); renderSettings(); save(); toast(d ? '已切换日间' : '已开启夜间护眼', 'ok'); return; }
  if (e.target.closest('#sw-indent')) { const b = curBook(); if (!b) return; b.settings.indent = !b.settings.indent; applyRead(b); renderSettings(); save(); return; }
  if (e.target.closest('#row-theme')) { const b = curBook(); if (!b) return toast('先新建一部作品', 'warn'); const d = b.settings.theme === 'dark'; b.settings.theme = d ? 'light' : 'dark'; applyRead(b); renderSettings(); save(); toast(d ? '已切换日间' : '已开启夜间护眼', 'ok'); return; }
  if (e.target.closest('#row-indent')) { const b = curBook(); if (!b) return; b.settings.indent = !b.settings.indent; applyRead(b); renderSettings(); save(); return; }
  if (e.target.closest('#row-backup')) return exportAll();
  if (e.target.closest('#row-restore')) { const f = $('#f-json'); f.value = ''; f.click(); return; }
});
$('#s-set').addEventListener('change', e => {
  if (e.target.id === 'bg-custom') { setRead('bg', e.target.value); renderSettings(); }
  if (e.target.id === 'set-font') { setRead('font', e.target.value); }
});
$('#s-set').addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'set-fs') { $('#v-fs').textContent = t.value + 'px'; setRead('fs', num(t.value)); }
  if (t.id === 'set-lh') { $('#v-lh').textContent = Number(t.value).toFixed(1); setRead('lh', parseFloat(t.value)); }
  if (t.id === 'set-br') { $('#v-br').textContent = t.value + '%'; setRead('br', num(t.value)); }
});
$('#f-json').addEventListener('change', function () { const f = this.files && this.files[0]; if (f) importJson(f); });

/* 目录抽屉内的操作 */
$('#sheet').addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, b = curBook(); if (!b) return;
  const vid = el.dataset.vol, cid = el.dataset.id;
  if (a === 'ch-open') {
    commitLive();
    state.chId = cid;
    loadChapter();
    closeSheet();
    go('write');
    return;
  }
  if (a === 'ch-rename') { e.stopPropagation(); const c = findCh(b, cid); return renameDlg('ch', cid, c ? c.title : ''); }
  if (a === 'vol-rename') { e.stopPropagation(); const v = b.volumes.filter(x => x.id === vid)[0]; return renameDlg('vol', vid, v ? v.name : ''); }
  if (a === 'ch-add') { e.stopPropagation(); return addChapter(vid); }
  if (a === 'ch-add-last') { const v = findVolOf(b, state.chId) || b.volumes[b.volumes.length - 1] || b.volumes[0]; return addChapter(v.id); }
  if (a === 'vol-add') return addVolume();
  if (a === 'ch-del') {
    e.stopPropagation();
    const c = findCh(b, cid); if (!c) return;
    return confirmDlg('删除章节', '确定删除「' + c.title + '」吗？该章 ' + fnum(c.wordCount) + ' 字，删除后无法恢复。', '删除', () => {
      b.volumes.forEach(v => { v.chapters = v.chapters.filter(x => x.id !== cid); });
      if (state.chId === cid) { const f = chapters(b)[0]; state.chId = f ? f.c.id : ''; if (state.chId) loadChapter(); }
      b.updatedAt = Date.now(); save(true); openToc(); updateMeta();
      toast('章节已删除', 'ok');
    });
  }
  if (a === 'vol-del') {
    e.stopPropagation();
    const v = b.volumes.filter(x => x.id === vid)[0]; if (!v) return;
    if (b.volumes.length <= 1) return toast('至少保留一卷', 'warn');
    return confirmDlg('删除整卷', '确定删除「' + v.name + '」及其下 ' + v.chapters.length + ' 章吗？', '删除', () => {
      b.volumes = b.volumes.filter(x => x.id !== vid);
      b.volumes.forEach((x, i) => { x.order = i; });
      if (!findCh(b, state.chId)) { const f = chapters(b)[0]; state.chId = f ? f.c.id : ''; if (state.chId) loadChapter(); }
      b.updatedAt = Date.now(); save(true); openToc(); updateMeta();
      toast('整卷已删除', 'ok');
    });
  }
});
function addChapter(volId) {
  const b = curBook(); if (!b) return;
  const v = b.volumes.filter(x => x.id === volId)[0] || b.volumes[b.volumes.length - 1];
  if (!v) { addVolume(); return; }
  const c = newChapter('第' + (v.chapters.length + 1) + '章');
  v.chapters.push(c);
  b.updatedAt = Date.now();
  commitLive();
  state.chId = c.id;
  loadChapter();
  save(true);
  openToc();
  renameDlg('ch', c.id, c.title);
}
function addVolume() {
  const b = curBook(); if (!b) return;
  const v = newVolume('第' + (b.volumes.length + 1) + '卷');
  v.order = b.volumes.length;
  b.volumes.push(v);
  b.updatedAt = Date.now();
  save(true);
  openToc();
  renameDlg('vol', v.id, v.name);
}
/* 物理返回键 / 侧滑（Android/桌面浏览器）*/
window.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if ($('#modal-root .mask')) { const m = $('#modal-root .mask'); m.remove(); return; }
  if (state.sheet) return closeSheet();
  if (state.screen !== 'home') return go('home');
});

/* =========================================================================
   11 · 启动
   ========================================================================= */
if (DB.books.length) {
  const last = book(PREFS.last) || DB.books[0];
  state.bookId = last.id;
  const f = chapters(last)[0];
  state.chId = f ? f.c.id : '';
  state.charId = (last.worldbuilding.characters[0] || {}).id || '';
  applyRead(last);
  if (f) loadChapter();
  go('home');
} else {
  applyRead(null);
  go('home');
}
window.addEventListener('beforeunload', () => { commitLive(); save(true); });
setInterval(() => { if (live && live.dirty) commitLive(); }, 8000);

/* Service Worker（放到 https 上时自动生效，离线可开） */
(function () {
  const can = ('serviceWorker' in navigator) && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1');
  if (can) window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => { }); });
})();
</script>
